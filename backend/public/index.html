<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeadZam CRM - Click to Call</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6fa; margin: 0; color: #1c2434; }
    header { background: #1f2a44; color: #fff; padding: 16px 24px; }
    header h1 { margin: 0; font-size: 20px; }
    main { max-width: 640px; margin: 24px auto; padding: 0 16px; }
    .lead { background: #fff; border: 2px solid transparent; border-radius: 10px;
            padding: 16px; margin-bottom: 14px; display: flex; justify-content: space-between;
            align-items: center; gap: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .lead.active { border-color: #3b5bdb; }
    .name { font-weight: 600; font-size: 17px; }
    .phone { color: #444; margin-top: 2px; }
    .stage { display: inline-block; margin-top: 6px; font-size: 12px; background: #e7ecff;
             color: #2b3a8c; padding: 2px 8px; border-radius: 999px; }
    .right { text-align: right; min-width: 170px; }
    button { background: #3b5bdb; color: #fff; border: 0; border-radius: 8px;
             padding: 10px 22px; font-size: 15px; cursor: pointer; }
    button:disabled { background: #9aa5d6; cursor: not-allowed; }
    button:focus-visible { outline: 3px solid #1c2434; outline-offset: 2px; }
    .status { margin-top: 8px; font-size: 13px; min-height: 18px; }
    .status.ready { color: #666; }
    .status.sending { color: #b26a00; }
    .status.sent { color: #1b7f3b; }
    .status.error { color: #c0262d; }
    .note { font-size: 12px; color: #666; margin-top: 18px; }
  </style>
</head>
<body>
  <header><h1>LeadZam CRM</h1></header>
  <main>
    <div id="leads"></div>
    <p class="note">"Request sent" means Firebase accepted the message. It does not mean the phone received it.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
